<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F/A-18 Showcase</title>
<style>
:root{ --bg:#14181d; --card:#1d232b; --line:#2e3742; --text:#dde3ea; --muted:#8b96a5; --accent:#ffd54a; --bad:#ff6a50; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 8px 0 0;font-weight:600}
button,select,input[type=text],label.btn{background:#262e38;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
input[type=text]{cursor:text;width:90px;text-transform:uppercase}
button:hover,label.btn:hover{border-color:var(--muted)}
button.on{border-color:var(--accent);color:var(--accent)}
label.ck{display:inline-flex;gap:4px;align-items:center;cursor:pointer}
a.dl{background:var(--accent);color:#14181d;font-weight:600;text-decoration:none;border-radius:6px;padding:6px 12px}
a.dl:hover{filter:brightness(1.1)}
#main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;padding:12px 16px}
#view{position:relative;min-width:0}
#cfg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:8px;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:8px}
#cfg .cfgt{font-weight:600;color:var(--accent)}
#cfg .presets{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:auto}
#spec a{color:var(--accent)}
#cv{width:100%;aspect-ratio:4/3;display:block;cursor:grab;touch-action:none;background:radial-gradient(#2f3843,#181d23);border-radius:8px}
#cv:active{cursor:grabbing}
#side{display:flex;flex-direction:column;gap:8px;min-width:0}
#side .box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
#side h2{font-size:13px;margin:0 0 6px;font-weight:600}
#tex{width:100%;image-rendering:pixelated;display:block;background:repeating-conic-gradient(#333 0 25%,#444 0 50%) 0 0/16px 16px}
#info,#pinfo{color:var(--muted);font-size:12px;white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace}
#hint{color:var(--muted);font-size:12px}
#msg{color:var(--accent)}
#variants{display:flex;gap:6px;flex-wrap:wrap}
#variants button{padding:6px 12px}
#variants button b{display:block;font-size:14px}
#variants button span{font-size:11px;color:var(--muted)}
.views{display:inline-flex;gap:4px}
#spec h2{font-size:15px;margin:0 0 4px}
#spec table{width:100%;border-collapse:collapse;font-size:12px}
#spec td{padding:2px 0;border-bottom:1px solid var(--line)}
#spec td:last-child{text-align:right;color:var(--accent)}
#spec p{color:var(--muted);font-size:12px;margin:6px 0 0}
@media (max-width:760px){ #main{grid-template-columns:1fr;padding:8px} header{padding:8px} }
</style>
</head>
<body>
<header>
  <h1>F/A-18 Hornet / Super Hornet / Blue Angels</h1>
  <a class="dl" href="https://drive.google.com/drive/folders/1oyXLwGo3wNmMIjN1IDml8Z5ywTf0U-37" target="_blank" rel="noopener">⬇ Download all six models (Google Drive)</a>
  <div id="variants"></div>
  <label class="ck"><input type="checkbox" id="spin" checked> Auto-rotate</label>
  <label class="ck"><input type="checkbox" id="edges"> Wireframe</label>
  <span class="views"><button data-v="iso">3/4</button><button data-v="top">Top</button><button data-v="side">Side</button><button data-v="front">Front</button></span>
  <span id="msg"></span>
  <span id="hint">Drag to rotate · scroll to zoom · click a face for details</span>
  <span hidden>
    <select id="pick"><option>F18C</option><option>F18</option><option>F18E</option><option>F18F</option></select>
    <input type="text" id="other">
    <select id="pal"><option value="game">FA</option><option value="gray">Grey</option><option value="hue">False colour</option></select>
    <input id="palfile" type="file">
    <select id="mode"><option value="tex">tex</option><option value="texonly">texonly</option><option value="flat">flat</option><option value="check">check</option></select>
    <select id="light"><option value="2">2</option><option value="1">1</option><option value="0">0</option></select>
    <select id="transp"><option value="1">1</option><option value="2">2</option><option value="0">0</option></select>
    <input type="checkbox" id="order" checked>
  </span>
</header>
<div id="main">
  <div id="view"><canvas id="cv"></canvas>
    <div id="cfg">
      <span class="cfgt">Configuration</span>
      <label class="ck"><input type="checkbox" id="gear" checked> Landing gear down</label>
      <label class="ck"><input type="checkbox" id="flaps"> Flaps down</label>
      <label class="ck"><input type="checkbox" id="hook"> Tailhook down</label>
      <label class="ck"><input type="checkbox" id="brake"> Speed brake open</label>
      <label class="ck"><input type="checkbox" id="ab"> Afterburner</label>
      <span class="presets"><button data-p="clean">Clean</button><button data-p="trap">Carrier landing</button><button data-p="takeoff">Takeoff</button><button data-p="fight">Combat</button></span>
    </div>
  </div>
  <div id="side">
    <div class="box" id="spec"></div>
    <div class="box"><h2>Model data</h2><div id="info"></div><div id="pinfo"></div></div>
    <div class="box"><h2>PIC texture<span id="texname" style="color:var(--muted);font-weight:normal"></span></h2>
      <label class="ck" style="margin-bottom:6px"><input type="checkbox" id="uvlines"> Show UV outlines</label>
      <canvas id="tex"></canvas></div>
  </div>
</div>
<script>
"use strict";
// ===== SH parser (from sh_gallery.html; also reads each face's colour index and texture coordinates) =====
const FACE_OPS = new Set([0x41,0x44,0x49,0x4C,0x51,0x54,0x59,0x5C,0x61,0x63,0x64,0x69,0x6B,0x6C,0x71,0x73,0x7C,0xCD,0xDD,0xED,0xEE,0xFE]);
function parseSH(u8){
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let base = 0x400;
  if (u8[0] === 0x4D && u8[1] === 0x5A){
    const pe = dv.getUint32(0x3C, true), ns = dv.getUint16(pe+6, true), opt = dv.getUint16(pe+20, true);
    for (let i=0;i<ns;i++){ const s = pe+24+opt+i*40; if (String.fromCharCode(...u8.subarray(s, s+4)) === "CODE"){ base = dv.getUint32(s+20, true); break; } }
  }
  const c = u8.subarray(base), cv = new DataView(c.buffer, c.byteOffset, c.byteLength), L = c.length;
  const shift = L > 8 ? cv.getUint16(6, true) : 8, scale = shift >= 4 && shift <= 16 ? Math.pow(2, shift - 8) : 1;
  // Find every vertex buffer of the first LOD (each target must follow on from the previous count)
  const bufs = [], maxAbs = (o, n) => { let m = 0; for (let i = 0; i < 3*n; i++) m = Math.max(m, Math.abs(cv.getInt16(o + 6 + 2*i, true))); return m; };
  for (let o=0;o<L-6;o++){
    if (c[o] !== 0x82 || c[o+1] !== 0) continue;
    const n = cv.getUint16(o+2,true), t = cv.getUint16(o+4,true), e = o+6+6*n;
    if (!n || n > 4000 || t % 8 || e >= L) continue;
    if (!bufs.length){ if (t === 0 && n >= 3) bufs.push({ o, n, t:0, e }); continue; }
    const last = bufs[bufs.length-1];
    if (bufs.length === 1 && t === 0 && o < last.e && n >= 3 && maxAbs(o, n) * 4 < maxAbs(last.o, last.n)){ bufs[0] = { o, n, t:0, e }; continue; }   // the first one was a fake 82 inside the header (e.g. C5); the real buffer lies inside its range
    if (t === 0 && o >= last.e && (c[o-1] === 0 || c[o-1] === 0x1E)){ bufs.push({ o, n, t:-1 }); break; }   // next LOD
    const gap = t/8 - (last.t + last.n);   // targets usually follow on; some files (F35A, Y141, SU27…) skip a few slots
    if (o >= last.e && (gap === 0 || gap > 0 && gap <= 64 && (c[o-1] === 0 || c[o-1] === 0x1E) && maxAbs(o, n) < 8192)){ bufs.push({ o, n, t: t/8, e }); }
  }
  if (!bufs.length) return null;
  const lod = bufs.filter(b => b.t >= 0), stop = bufs.find(b => b.t < 0)?.o ?? L;
  const v = [];
  for (const b of lod) for (let i=0;i<b.n;i++) v[b.t+i] = [cv.getInt16(b.o+6+6*i,true), cv.getInt16(b.o+8+6*i,true), cv.getInt16(b.o+10+6*i,true)];
  const facetsIn = (from, to, lo, hi) => {
    const f = [];
    for (let o=from; o<to-18; o++){
      if (c[o] !== 0xFC) continue;
      const fl = cv.getUint16(o+1,true), hl = fl & 0x200 ? 14 : 17;
      if (fl & 0x200 ? fl & 0xF000 || !FACE_OPS.has(fl & 0xFF) && (fl & 0xFF) !== 0xFD && (fl & 0xFF) !== 0x74 : !FACE_OPS.has(fl & 0xFF) || fl >= 0x1000) continue;   // only accept known flag bytes (plus FD and 74 used by the F-14), so data is not misread as faces; the fake triangle in front of the SPE tail is 7F
      const n = c[o+hl], wide = fl & 0x400; let p = o+hl+1;
      if (n < 3 || n > 16 || p + n*(wide?2:1) > to) continue;
      const idx = []; for (let k=0;k<n;k++){ idx.push(wide ? cv.getUint16(p,true) : c[p]); p += wide?2:1; }
      if (idx.some(i => i < lo || i >= hi || !v[i]) || new Set(idx).size < n) continue;
      // Texture coords: flag 0x04 = has UVs (pixel coords in the PIC); 0x100 = 1 byte per coord, otherwise 2 bytes
      let uv = null;
      if (fl & 4){ uv = []; for (let k=0;k<n;k++){ if (fl & 0x100){ uv.push([c[p], c[p+1]]); p += 2; } else { uv.push([cv.getUint16(p,true), cv.getUint16(p+2,true)]); p += 4; } } }
      idx.uv = uv; idx.col = c[o+3]; idx.fl = fl;
      f.push(idx); o = p - 1;   // skip this face's data so no fake face is read from its indices (the right-hand triangle on F5EV)
    }
    return f;
  };
  const main = lod[0], mainEnd = lod[1]?.o ?? stop;
  const f = facetsIn(main.e, mainEnd, 0, main.n);
  // Edited SH files (tools/shgen/sh_subdivide.py, f14_nose.py): an original face or node becomes `12 00 rel16` (call) + `38 rel16` (skip);
  // the called block holds an 82 vertex buffer, F6 per-vertex shading, FC faces, 06/0C plane tests (follow forward branches only; backward ones are the original BSP) and 00 00 return
  const faceAt = t => {
    const fl = cv.getUint16(t+1, true); let p = t + 5 + (fl & 0x60 ? (fl & 0x200 ? 9 : 12) : 0);
    const n = c[p++], wide = fl & 0x400, idx = [];
    for (let k = 0; k < n; k++){ idx.push(wide ? cv.getUint16(p, true) : c[p]); p += wide ? 2 : 1; }
    let uv = null; if (fl & 4){ uv = []; for (let k = 0; k < n; k++){ if (fl & 0x100){ uv.push([c[p], c[p+1]]); p += 2; } else { uv.push([cv.getUint16(p, true), cv.getUint16(p+2, true)]); p += 4; } } }
    idx.uv = uv; idx.col = c[t+3]; idx.fl = fl; f.push(idx); return p;
  };
  const block = (t, from, seen) => {
    for (let guard = 0; guard < 2000 && t > 0 && t < L - 2 && !seen.has(t); guard++){
      seen.add(t);
      if (c[t] === 0x82 && c[t+1] === 0){ const n = cv.getUint16(t+2, true), tg = cv.getUint16(t+4, true) / 8;
        for (let i = 0; i < n; i++) v[tg+i] = [cv.getInt16(t+6+6*i, true), cv.getInt16(t+8+6*i, true), cv.getInt16(t+10+6*i, true)]; t += 6 + 6*n; }
      else if (c[t] === 0xF6) t += 7;
      else if (c[t] === 0xFC) t = faceAt(t);
      else if ((c[t] === 0x06 || c[t] === 0x0C) && c[t+1] === 0){ const k = c[t] === 0x06 ? 14 : 10;
        for (const [r, e] of [[t+k, t+k+2], [t+k+2, t+k+4]]){ const g = e + cv.getInt16(r, true); if (g > from) block(g, from, seen); }
        t += k + 4; }
      else return;
    }
  };
  for (let o = main.e; o < mainEnd - 7; o++){
    if (c[o] !== 0x12 || c[o+1] !== 0 || c[o+4] !== 0x38) continue;
    const t = o + 4 + cv.getInt16(o+2, true); if (t <= mainEnd || t >= L - 6 || ![0x82, 0xFC, 0x06].includes(c[t])) continue;
    block(t, t - 1, new Set());
    o += 6;
  }
  if (!f.length) return null;
  let span = 0; for (let i=0;i<main.n;i++) span = Math.max(span, Math.abs(v[i][0]));
  const parts = [];
  for (let k=1;k<lod.length;k++){
    const b = lod[k], to = lod[k+1]?.o ?? stop; if (b.n < 12) continue;
    let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
    for (let i=0;i<b.n;i++){ const p = v[b.t+i]; x0 = Math.min(x0,p[0]); x1 = Math.max(x1,p[0]); z0 = Math.min(z0,p[2]); z1 = Math.max(z1,p[2]); }
    const ax = Math.max(Math.abs(x0), Math.abs(x1));
    if (ax < span*0.6 || z1 - z0 > (x1 - x0)*0.5) continue;
    const pf = facetsIn(b.e, to, b.t, b.t + b.n); if (!pf.length) continue;
    const pts = []; for (let i=0;i<b.n;i++) pts.push(v[b.t+i]);
    // pivot: the outermost leading corner of the wing glove (main-body vertex within the wing chord, farthest from the fuselage and most forward)
    const side = Math.sign(x0 + x1), tipX = side > 0 ? x1 : -x0;
    const ys = pts.map(p => p[1]), wy0 = Math.min(...ys), wy1 = Math.max(...ys), lenY = 2*span;
    let g = null; for (let i=0;i<main.n;i++){ const p = v[i], ax2 = p[0]*side;
      if (ax2 > 0 && ax2 < tipX*0.6 && p[1] >= wy0 && p[1] <= wy1 + 0.15*lenY && (!g || ax2 > g[0]*side || (ax2 === g[0]*side && p[1] > g[1]))) g = p; }
    const piv = g ? [g[0], g[1]] : [0, 0];
    parts.push({ f: pf, wing: true, side, pivot: [piv[0], piv[1], 0] });
  }
  // all sub-part vertex sets of the first LOD (gear, flaps, speed brake…) and the code that controls them
  const subs = lod.slice(1).map((b, k) => ({ o: b.o, t: b.t, n: b.n, f: facetsIn(b.e, lod[k+2]?.o ?? stop, b.t, b.t + b.n),
    local: b.o >= 14 && c[b.o-14] === 0xFF && c[b.o-13] === 0xFF }));
  return { v: v.map(p => p || [0,0,0]), f, parts, scale, subs, code: c, ctl: parseCtl(c, cv, subs), imp: shImports(u8, c) };
}

// SH import table: each control variable is a global provided by FA.EXE, named in the import table (e.g. _PLgearDown, _PLleftFlap)
// returns { name: address used by the code } (address = location of the ff 25 [IAT] thunk)
function shImports(u8, c){
  const out = {}; if (u8[0] !== 0x4D || u8[1] !== 0x5A) return out;
  try {
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength), pe = dv.getUint32(0x3C, true), ns = dv.getUint16(pe+6, true), opt = dv.getUint16(pe+20, true);
    const secs = []; for (let i = 0; i < ns; i++){ const s = pe+24+opt+i*40; secs.push([dv.getUint32(s+12, true), Math.max(dv.getUint32(s+8, true), dv.getUint32(s+16, true)), dv.getUint32(s+20, true)]); }
    const r2o = r => { for (const [va, sz, ro] of secs) if (r >= va && r < va + sz) return r - va + ro; return -1; };
    const str = o => { let s = ""; while (o >= 0 && o < u8.length && u8[o]) s += String.fromCharCode(u8[o++]); return s; };
    let d = r2o(dv.getUint32(pe+24+104, true));
    for (; d >= 0 && dv.getUint32(d+12, true); d += 20){
      const iat = dv.getUint32(d+16, true); let t = r2o(dv.getUint32(d, true) || iat);
      for (let k = 0; t >= 0 && dv.getUint32(t, true); k++, t += 4){
        const name = str(r2o(dv.getUint32(t, true)) + 2), a = iat + 4*k;
        for (let o = 0; o < c.length - 6; o++) if (c[o] === 0xFF && c[o+1] === 0x25 && c[o+2] === (a & 255) && c[o+3] === (a >> 8 & 255) && c[o+4] === (a >> 16 & 255) && c[o+5] === (a >>> 24)){ out[name] = o + 0x1000; break; }
      }
    }
  } catch(e){}
  return out;
}
// F0 blocks in an SH are raw x86 code that the game runs directly. Common patterns:
//   cmp word [var], value ; jne …        → condition (gear down, flaps down…)
//   call $+5 ; pop ebx ; add ebx, n ; mov ax, [angle var] ; sar/shl/add/sub/neg ; mov [ebx+d], ax
//                                          → patches a field of the following C4 op at run time (gear retraction, swing-wing sweep)
//   push retAddr ; push interpreter ; ret → back to the bytecode, continuing at retAddr
// The op at retAddr: C4 00 x up fwd hdg pitch roll rel16 = place the vertex set at (x, up, fwd), rotate and draw; 12 00 rel16 = draw it in place
// A tiny x86 emulator runs these for a given state to work out which parts to draw and where.
const SH_VA = 0x1000;
function x86Run(mem, start, maxSteps = 400){
  const dv = new DataView(mem.buffer, mem.byteOffset, mem.byteLength), L = mem.length;
  const rd16 = va => { const o = va - SH_VA; return o >= 0 && o + 1 < L ? dv.getInt16(o, true) : 0; };
  const rd32 = va => { const o = va - SH_VA; return o >= 0 && o + 3 < L ? dv.getInt32(o, true) : 0; };
  const wr16 = (va, x) => { const o = va - SH_VA; if (o >= 0 && o + 1 < L) dv.setInt16(o, x, true); };
  const s16 = x => (x << 16) >> 16;
  let p = start, ax = 0, cx = 0, eax = 0, ebx = 0, fa = 0, fb = 0, sz = 16; const stack = [];
  const cc = op => { const sa = sz === 8 ? (fa << 24) >> 24 : sz === 16 ? s16(fa) : fa | 0, sb = sz === 8 ? (fb << 24) >> 24 : sz === 16 ? s16(fb) : fb | 0;
    const m = sz === 32 ? 0xFFFFFFFF : (1 << sz) - 1, ua = (fa & m) >>> 0, ub = (fb & m) >>> 0;
    switch (op & 0xF){ case 2: return ua < ub; case 3: return ua >= ub; case 4: return sa === sb; case 5: return sa !== sb;
      case 6: return ua <= ub; case 7: return ua > ub; case 0xC: return sa < sb; case 0xD: return sa >= sb; case 0xE: return sa <= sb; case 0xF: return sa > sb; } return null; };
  for (let n = 0; n < maxSteps; n++){
    const o = p - SH_VA; if (o < 0 || o >= L - 1) return null;
    const b0 = mem[o], b1 = mem[o+1], b2 = mem[o+2];
    if (b0 === 0x66){
      if (b1 === 0x83 && b2 === 0x3D){ fa = rd16(rd32(p+3)); fb = (mem[o+7] << 24) >> 24; sz = 16; p += 8; continue; }
      if (b1 === 0x81 && b2 === 0x3D){ fa = rd16(rd32(p+3)); fb = dv.getInt16(o+7, true); sz = 16; p += 9; continue; }
      if (b1 === 0xA1){ ax = rd16(rd32(p+2)); p += 6; continue; }
      if (b1 === 0x8B && b2 === 0xC8){ cx = ax; p += 3; continue; }
      if (b1 === 0x89 && b2 === 0xC1){ cx = ax; p += 3; continue; }
      if (b1 === 0x8B && b2 === 0xC1){ ax = cx; p += 3; continue; }
      if (b1 === 0x89 && b2 === 0xC8){ ax = cx; p += 3; continue; }
      if (b1 === 0xD1 && b2 === 0xF8){ ax = s16(ax) >> 1; p += 3; continue; }
      if (b1 === 0xD1 && b2 === 0xF9){ cx = s16(cx) >> 1; p += 3; continue; }
      if (b1 === 0xC1 && b2 === 0xF8){ ax = s16(ax) >> mem[o+3]; p += 4; continue; }
      if (b1 === 0xC1 && b2 === 0xF9){ cx = s16(cx) >> mem[o+3]; p += 4; continue; }
      if (b1 === 0xD1 && b2 === 0xE0){ ax = s16(ax << 1); p += 3; continue; }
      if (b1 === 0xC1 && b2 === 0xE0){ ax = s16(ax << mem[o+3]); p += 4; continue; }
      if ((b1 === 0x03 && b2 === 0xC1) || (b1 === 0x01 && b2 === 0xC8)){ ax = s16(ax + cx); p += 3; continue; }
      if ((b1 === 0x2B && b2 === 0xC1) || (b1 === 0x29 && b2 === 0xC8)){ ax = s16(ax - cx); p += 3; continue; }
      if (b1 === 0x05){ ax = s16(ax + dv.getInt16(o+2, true)); p += 4; continue; }
      if (b1 === 0x2D){ ax = s16(ax - dv.getInt16(o+2, true)); p += 4; continue; }
      if (b1 === 0x83 && b2 === 0xC0){ ax = s16(ax + ((mem[o+3] << 24) >> 24)); p += 4; continue; }
      if (b1 === 0x83 && b2 === 0xE8){ ax = s16(ax - ((mem[o+3] << 24) >> 24)); p += 4; continue; }
      if (b1 === 0x3D){ fa = ax; fb = dv.getInt16(o+2, true); sz = 16; p += 4; continue; }
      if (b1 === 0x83 && b2 === 0xF8){ fa = ax; fb = (mem[o+3] << 24) >> 24; sz = 16; p += 4; continue; }
      if (b1 === 0xB8){ ax = dv.getInt16(o+2, true); p += 4; continue; }
      if (b1 === 0xF7 && b2 === 0xD8){ ax = s16(-ax); p += 3; continue; }
      if (b1 === 0x89 && b2 === 0x43){ wr16(ebx + ((mem[o+3] << 24) >> 24), ax); p += 4; continue; }
      if (b1 === 0x89 && b2 === 0x83){ wr16(ebx + dv.getInt32(o+3, true), ax); p += 7; continue; }
      if (b1 === 0xA3){ wr16(rd32(p+2), ax); p += 6; continue; }
      return null;

  resize(); gl.viewport(0, 0, cv.width, cv.height); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  if (!cur || !cur.n) return;
  const pal = curPal(), rgb = new Uint8Array(256*3); rgb.set(pal); setTex(palTex, 256, 1, gl.RGB, rgb);
  gl.useProgram(prog); gl.enable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
  gl.uniformMatrix4fv(U("uM"), false, matrix());
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, picTex); gl.uniform1i(U("uPic"), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, palTex); gl.uniform1i(U("uPal"), 1);
  gl.uniform2f(U("uSize"), cur.pic ? cur.pic.w : 1, cur.pic ? cur.pic.h : 1);
  const mode = $("mode").value; gl.uniform1f(U("uMode"), mode === "check" ? 1 : mode === "flat" || !cur.pic ? 2 : 0);
  gl.uniform1f(U("uLight"), +$("light").value); gl.uniform1f(U("uTransp"), +$("transp").value);
  // FA draws faces in order (later covers earlier) and decal faces often share a plane with the body: polygonOffset pulls later faces slightly forward
  gl.enable(gl.POLYGON_OFFSET_FILL);

  const bias = $("order").checked;
  if (!bias) gl.polygonOffset(0, 0), gl.drawArrays(gl.TRIANGLES, 0, cur.n);
  else cur.faces.forEach((f, i) => { if (!f.cnt) return; gl.polygonOffset(-i * 0.004, -i * 0.5); gl.drawArrays(gl.TRIANGLES, f.first, f.cnt); });
  if ($("edges").checked && cur.en){ gl.disable(gl.POLYGON_OFFSET_FILL); bindAttrs(edgeVbo); gl.uniform1f(U("uMode"), 2); gl.uniform1f(U("uLight"), 0); gl.uniform1f(U("uSel"), 0); gl.uniform1f(U("uZB"), 0.0008); gl.drawArrays(gl.LINES, 0, cur.en); gl.uniform1f(U("uZB"), 0); gl.enable(gl.POLYGON_OFFSET_FILL); }
  if (sel >= 0 && cur.selN){ gl.polygonOffset(-10, -4000); bindAttrs(selVbo); gl.uniform1f(U("uSel"), 1); gl.drawArrays(gl.TRIANGLES, 0, cur.selN); }

function drawTex(){
  const c = $("tex"), x = c.getContext("2d");
  if (!cur || !cur.pic){ c.width = 256; c.height = 64; x.clearRect(0, 0, 256, 64); x.fillStyle = "#8b96a5"; x.fillText("No PIC", 100, 36); return; }
  const { w, h, px } = cur.pic, s = 2, pal = curPal(), im = new ImageData(w, h), tr = $("transp").value !== "0";
  for (let i = 0; i < w*h; i++){ const p = px[i]; im.data[4*i] = pal[3*p]; im.data[4*i+1] = pal[3*p+1]; im.data[4*i+2] = pal[3*p+2]; im.data[4*i+3] = tr && p === 255 ? 0 : 255; }
  c.width = w*s; c.height = h*s; const t = document.createElement("canvas"); t.width = w; t.height = h; t.getContext("2d").putImageData(im, 0, 0);
  x.imageSmoothingEnabled = false; x.drawImage(t, 0, 0, w*s, h*s);
  if (!$("uvlines").checked && sel < 0) return;
  x.lineWidth = 1;
  cur.faces.forEach((f, i) => { if (!f.uv || (!$("uvlines").checked && i !== sel)) return;
    x.strokeStyle = i === sel ? "#ffd54a" : "rgba(255,70,50,.75)"; x.lineWidth = i === sel ? 3 : 1;
    x.beginPath(); f.uv.forEach(([u, v], k) => k ? x.lineTo(u*s, v*s) : x.moveTo(u*s, v*s)); x.closePath(); x.stroke(); });
}
function setSel(i){
  sel = i; const f = cur.faces[i];
  if (!f){ $("pinfo").textContent = ""; cur.selN = 0; return; }
  const d = []; for (let k = 1; k < f.pts.length - 1; k++) for (const j of [0, k, k+1]){ const q = f.pts[j], uv = f.uv ? f.uv[j] : [0,0]; d.push(q[0], q[1], q[2], uv[0], uv[1], ...f.n, f.col, f.uv ? 1 : 0); }
  gl.bindBuffer(gl.ARRAY_BUFFER, selVbo); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(d), gl.STATIC_DRAW); cur.selN = d.length / 10;
  $("pinfo").textContent = `\nSelected face ${i} (${f.part})\nFlags ${f.fl.toString(16).toUpperCase().padStart(4, "0")}  colour ${f.col.toString(16).toUpperCase().padStart(2, "0")}\nVertices ${f.idx.join(" ")}\nUV ${f.uv ? f.uv.map(p => `(${p[0]},${p[1]})`).join(" ") : "(none)"}`;
}
// picking: project each triangle to the screen and find the nearest one under the pointer
function pick(mx, my){
  const M = matrix(), w = cv.clientWidth, h = cv.clientHeight; let best = -1, bz = Infinity;
  const proj = q => { const x = M[0]*q[0]+M[4]*q[1]+M[8]*q[2]+M[12], y = M[1]*q[0]+M[5]*q[1]+M[9]*q[2]+M[13], z = M[2]*q[0]+M[6]*q[1]+M[10]*q[2]+M[14], ww = M[3]*q[0]+M[7]*q[1]+M[11]*q[2]+M[15];
    return [(x/ww*0.5+0.5)*w, (0.5-y/ww*0.5)*h, z/ww]; };
  cur.faces.forEach((f, i) => { if (!f.draw) return; const p = f.pts.map(proj);
    for (let k = 1; k < p.length - 1; k++){ const [a, b, c] = [p[0], p[k], p[k+1]], d = (b[1]-c[1])*(a[0]-c[0]) + (c[0]-b[0])*(a[1]-c[1]); if (Math.abs(d) < 1e-9) continue;
      const l1 = ((b[1]-c[1])*(mx-c[0]) + (c[0]-b[0])*(my-c[1])) / d, l2 = ((c[1]-a[1])*(mx-c[0]) + (a[0]-c[0])*(my-c[1])) / d, l3 = 1 - l1 - l2;
      if (l1 < 0 || l2 < 0 || l3 < 0) continue; const z = l1*a[2] + l2*b[2] + l3*c[2] - i * 1e-7; if (z < bz){ bz = z; best = i; } } });
  return best;
}
{ let drag = null;
  cv.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, moved: 0 }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.moved += Math.abs(dx) + Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY;
    view.yaw += dx * 0.01; view.pitch = Math.max(-1.55, Math.min(1.55, view.pitch + dy * 0.01)); draw(); });
  cv.addEventListener("pointerup", e => { if (drag && drag.moved < 4 && cur){ const r = cv.getBoundingClientRect(); setSel(pick(e.clientX - r.left, e.clientY - r.top)); draw(); drawTex(); } drag = null; });
  cv.addEventListener("wheel", e => { e.preventDefault(); view.zoom = Math.max(0.3, Math.min(20, view.zoom * Math.exp(-e.deltaY * 0.0015))); draw(); }, { passive: false });
  addEventListener("resize", draw);
}

// ===== Loading =====
async function load(name){
  name = name.toUpperCase().replace(/\.SH$/, ""); $("msg").textContent = "Loading " + name + "…";
  const u8 = await fetchAny([(name.includes("/") ? "" : "SH/") + name + ".SH"]); if (!u8){ $("msg").textContent = "Cannot find " + name + ".SH"; return; }
  const m = parseSH(u8); if (!m){ $("msg").textContent = "Cannot parse " + name + ".SH"; return; }
  const texNames = shTexName(u8), picName = (texNames[0] || "_" + name + ".PIC").toUpperCase();
  let pic = null, pu8 = await fetchAny(["PIC/" + picName, "PIC/" + picName.toLowerCase(), "PIC/" + picName.replace(/^_/, "_").replace(/\.PIC$/, ".pic")]);
  try { if (pu8) pic = parsePIC(pu8); } catch(e){ $("msg").textContent = e.message; }
  cur = { name, m, pic, picName, texNames };
  if (pic) setTex(picTex, pic.w, pic.h, gl.LUMINANCE, pic.px);
  $("texname").textContent = pic ? `  ${picName} (${pic.w}×${pic.h}, flipped to texture orientation)` : "  cannot find " + picName;
  buildFaces();
  if (pic || !pu8) $("msg").textContent = $("pal").value === "game" && !gamePal ? "FA palette not found, showing greyscale" : "";
}
$("pick").onchange = () => load($("pick").value);
$("other").onkeydown = e => { if (e.key === "Enter" && e.target.value.trim()) load(e.target.value.trim()); };
for (const id of ["mode", "gear", "flaps", "hook", "brake", "ab"]) $(id).onchange = () => cur && buildFaces();
const PRESETS = { clean: [0,0,0,0,0], trap: [1,1,1,0,0], takeoff: [1,1,0,0,1], fight: [0,0,0,1,1] };
document.querySelectorAll("#cfg .presets button").forEach(b => b.onclick = () => { ["gear","flaps","hook","brake","ab"].forEach((id, k) => $(id).checked = !!PRESETS[b.dataset.p][k]); cur && buildFaces(); });
for (const id of ["light", "transp", "pal", "uvlines", "order", "edges"]) $(id).onchange = () => { draw(); drawTex(); };
$("palfile").onchange = async e => { const f = e.target.files[0]; if (!f) return; const u8 = new Uint8Array(await f.arrayBuffer());
  const p = /\.lib$/i.test(f.name) ? palFromLib(u8) : palFromBytes(u8);
  if (!p){ $("msg").textContent = "Cannot read a palette from " + f.name; return; }
  gamePal = p; try { localStorage.setItem("fa_palette", btoa(String.fromCharCode(...p))); } catch(e){}
  $("pal").value = "game"; $("msg").textContent = "Loaded palette " + f.name + " (remembered in this browser)"; draw(); drawTex(); };
// ===== F/A-18 showcase =====

  { sh: "F18C", name: "F/A-18C", sub: "Single-seat Hornet", len: "56.0 ft (17.1 m)", span: "40.4 ft (12.3 m)", h: "15.3 ft (4.7 m)",

  { sh: "F18", name: "F/A-18D", sub: "Two-seat Hornet", len: "56.0 ft (17.1 m)", span: "40.4 ft (12.3 m)", h: "15.3 ft (4.7 m)",
    note: "The F/A-18C changes applied to the stock two-seat model, keeping the front and rear cockpits; otherwise the same shape as the C. Main gear doors are half their original height." },
  { sh: "F18E", name: "F/A-18E", sub: "Single-seat Super Hornet", len: "60.3 ft (18.4 m)", span: "44.7 ft (13.6 m)", h: "16.0 ft (4.9 m)",

function showSpec(v){
  $("spec").innerHTML = `<h2>${v.name}  <span style="color:var(--muted);font-weight:normal;font-size:12px">${v.sub} · ${v.sh}.SH</span></h2>
    <table><tr><td>Length</td><td>${v.len}</td></tr><tr><td>Span (incl. wingtip missiles)</td><td>${v.span}</td></tr><tr><td>Height</td><td>${v.h}</td></tr></table><p>${v.note}</p>

VAR.forEach(v => { const b = document.createElement("button"); b.dataset.sh = v.sh; b.innerHTML = `<b>${v.name}</b><span>${v.sub}</span>`;
