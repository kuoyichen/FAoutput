<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FA SH Shape Gallery</title>
<style>
:root{ --bg:#14181d; --card:#1d232b; --line:#2e3742; --text:#dde3ea; --muted:#8b96a5; --accent:#ffd54a; --bad:#ff6a50; --ok:#5fd38d; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 8px 0 0;font-weight:600}
button,select,input[type=search],label.btn{background:#262e38;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
input[type=search]{cursor:text;width:150px}
button:hover,label.btn:hover{border-color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:#3a3220;color:var(--accent)}
#stat{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:12px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.card.flag{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.card canvas{width:100%;aspect-ratio:1/1;display:block;cursor:grab;touch-action:none;background:radial-gradient(#2a323c,#181d23)}
.card canvas:active{cursor:grabbing}
.card .meta{display:flex;align-items:center;gap:6px;padding:5px 8px}
.card .nm{font-weight:600;font-family:ui-monospace,Consolas,monospace}
.card .info{color:var(--muted);font-size:11px;margin-left:auto;text-align:right}
.card .acts{display:flex;gap:6px;padding:0 8px 7px}
.card .acts button{padding:2px 8px;font-size:12px}
.card .acts button.on{border-color:var(--bad);color:var(--bad)}
.card .tag{font-size:11px;color:var(--accent)}
.card.fail canvas{opacity:.35}
details.sec{margin:8px 16px;border:1px solid var(--line);border-radius:8px;background:#171c22}
details.sec>summary{cursor:pointer;padding:10px 14px;font-size:15px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
details.sec>summary::before{content:"▸";color:var(--muted)}
details.sec[open]>summary::before{content:"▾"}
details.sec>summary small{color:var(--muted);font-weight:normal;font-size:12px}
details.sec .grid{padding-top:0}
#modal{position:fixed;inset:0;z-index:20;background:rgba(5,8,12,.85);display:none;align-items:center;justify-content:center}
#modal.show{display:flex}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:min(94vw,900px);max-height:96vh;overflow:auto}
#m_cv{width:100%;aspect-ratio:16/9;max-height:56vh;display:block;cursor:grab;touch-action:none;background:radial-gradient(#2a323c,#181d23);border-radius:6px}
#modal .bar{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
#modal .bar b{font-family:ui-monospace,Consolas,monospace;font-size:16px}
#m_rel{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px;align-items:center}
#m_rel button{padding:2px 8px;font-size:12px;font-family:ui-monospace,Consolas,monospace}
#m_rel button.on{border-color:var(--accent);color:var(--accent)}
#m_parts{margin-top:8px;font-size:12px}
#m_parts h3{font-size:13px;margin:6px 0 4px}
#m_parts .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0}
#m_parts .row b{min-width:150px;font-weight:600}
#m_parts button{padding:2px 9px;font-size:12px}
#m_parts button.on{border-color:var(--accent);color:var(--accent)}
#m_parts input[type=range]{flex:1;min-width:140px}
#m_parts .plist{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--muted)}
#m_parts .plist label{display:flex;gap:4px;align-items:center;cursor:pointer}
#m_parts details summary{cursor:pointer;color:var(--muted);margin-top:6px}
#hint{color:var(--muted);font-size:12px}
@media (max-width:600px){ .grid{grid-template-columns:repeat(2,1fr);gap:8px;padding:8px} header{padding:8px} details.sec{margin:8px} }
body.embed header,body.embed details.sec{display:none}
body.embed .grid{padding:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
a.fhome{font:800 17px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.4px;color:#e2e8ee;text-decoration:none;margin-right:6px;white-space:nowrap}a.fhome b{color:#ffd54a}a.fhome:hover{opacity:.85}
</style>
<script src="fashion_i18n.js"></script>

  const px = new Uint8Array(w * h);
  const rows = rowS >= 4 * h && rowO + rowS <= u8.length;

    try { upload(it); } catch(e){ console.error(it.k, e); it.state = "bad"; } }
  it.el.classList.toggle("fail", it.state !== "ok");
  it.info.textContent = it.state === "ok" ? L(`${it.nFaces} faces${it.m.subs.length ? ` · ${it.m.subs.length} parts` : ""} · L${it.size[1]} W${it.size[0]} ft`, `${it.nFaces} 面${it.m.subs.length ? `・${it.m.subs.length} 零件` : ""}・長${it.size[1]} 寬${it.size[0]} 呎`) : it.state === "missing" ? L("Unreadable", "讀不到") : L("Not parsed", "解不出");
  redrawItem(it); filterOne(it); statSoon();
}
// load what is on screen first, then the rest of the main list in the background
let active = 0; const queue = [];
function want(it){ if (it.state === "wait"){ it.state = "queued"; queue.push(it); pump(); } }
function pump(){ while (active < 8 && queue.length){ const it = queue.shift(); active++; it.state = "loading";
  fetchSH(it.k).then(u8 => setParsed(it, u8)).catch(() => setParsed(it, null)).finally(() => { active--; pump(); }); } }
const io = new IntersectionObserver(es => { for (const e of es){ const it = e.target._it; if (!it) continue;
  if (e.isIntersecting){ visible.add(it); if (it.state === "wait") { queue.unshift(it); it.state = "queued"; pump(); } else if (it.state !== "queued" && it.state !== "loading") paint(it.cv, it); } else visible.delete(it); } }, { rootMargin: "400px" });
for (const it of items){ it.el._it = it; io.observe(it.el); }
setTimeout(function bg(){ const rest = items.filter(i => i.grp === "main" && i.state === "wait"); for (const it of rest.slice(0, 12)) want(it); if (rest.length) setTimeout(bg, 500); }, 1500);

function filterOne(it){
  const q = $("q").value.trim().toUpperCase(), show = $("show").value;
  let vis = !q || it.k.includes(q);
  if (show === "ok") vis &&= it.state !== "bad" && it.state !== "missing";
  if (show === "fail") vis &&= it.state === "bad" || it.state === "missing";
  const was = it.el.style.display !== "none";
  it.el.style.display = vis ? "" : "none";
  if (vis && !was && visible.has(it)) paint(it.cv, it);
}
function filter(){ for (const it of items) filterOne(it);
  const q = $("q").value.trim().toUpperCase();   // a search that only matches wreckage / shadows opens that section
  if (q) for (const g of ["wreck", "shadow"]) if (items.some(it => it.grp === g && it.k.includes(q)) && !items.some(it => it.grp === "main" && it.k.includes(q))) $("sec_" + g).open = true; }
let statT = 0; const statSoon = () => { if (!statT) statT = setTimeout(() => { statT = 0; stat(); }, 200); };
function stat(){ const main = items.filter(i => i.grp === "main"), ok = main.filter(i => i.state === "ok").length, bad = main.filter(i => i.state === "bad").length, miss = main.filter(i => i.state === "missing").length, done = ok + bad + miss;
  $("stat").textContent = L(`${main.length} shapes (+${SH_GROUPS.wreck.length} wreckage, ${SH_GROUPS.shadow.length} shadows): ${ok} parsed, ${bad} failed${miss ? `, ${miss} unreadable` : ""}${done < main.length ? ` (${done} loaded)` : ""}`,
    `${main.length} 個外型（另有殘骸 ${SH_GROUPS.wreck.length}、陰影 ${SH_GROUPS.shadow.length}）：解得出 ${ok}、解不出 ${bad}${miss ? `、讀不到 ${miss}` : ""}${done < main.length ? `（已載入 ${done}）` : ""}`); }
function renderFlags(){}
$("q").oninput = filter; $("show").onchange = filter; if ($("q").value) filter();
function setMode(m){ MODE = m; try { localStorage.setItem("fa_gallery_mode", m); } catch(e){}
  for (const b of $("modes").children) b.classList.toggle("on", b.dataset.m === m);
  for (const it of visible) if (it.el.style.display !== "none") paint(it.cv, it); if (mItem) paint($("m_cv"), mItem, $("m_axes").checked); }
for (const b of $("modes").children) b.onclick = () => setMode(b.dataset.m);
for (const b of $("modes").children) b.classList.toggle("on", b.dataset.m === MODE);
$("dir").onchange = async e => {
  for (const f of e.target.files){ const n = f.name.toUpperCase();
    if (n.endsWith(".SH")) dirSH.set(n.slice(0, -3), f); else if (n.endsWith(".PIC")) dirPIC.set(n, f);
    else if (n === "PALETTE.PAL") setPal(palFromBytes(new Uint8Array(await f.arrayBuffer()))); }
  for (const n of dirPIC.keys()){ const p = pics.get(n); if (p?.tex) gl.deleteTexture(p.tex); pics.delete(n); }
  for (const it of items) if (dirSH.has(it.k)) dirSH.get(it.k).arrayBuffer().then(b => setParsed(it, new Uint8Array(b))); else if (it.state === "ok") redrawItem(it); };

// ===== Moving parts (gear, flaps, speed brake, swing wings…) =====
const optsOf = x => [...new Set([0, ...x.vals, ...(x.vals.length ? [1, -1] : [])])].sort((a, b) => a - b);
function reachable(it){   // which parts get drawn in some state, and when
  const m = it.m, reach = new Map(), base = defaultState(m).vars, cvars = m.ctl.vars.filter(x => x.vals.length);
  const tryState = (st, label) => { for (const e of evalCtl(m, st)) if (!reach.has(e.part)) reach.set(e.part, { label, op: e.op }); };
  tryState(base, L("default", "預設"));
  for (const x of cvars) for (const val of optsOf(x)) tryState({ ...base, [x.v]: val }, `${varName(m, x.v) || "[" + hex(x.v) + "]"} = ${val === -1 ? "FF" : val}`);
  return reach;
}
const VAR_EN = { _PLgearDown: "Landing gear", _PLgearPos: "Gear position", _PLleftFlap: "Left flap", _PLrightFlap: "Right flap", _PLbrake: "Speed brake", _PLhook: "Tailhook", _PLafterBurner: "Afterburner", _PLrudder: "Rudder", _PLswingWing: "Wing sweep", _PLbayOpen: "Weapon bay", _PLbayDoorPos: "Bay door angle", _PLslats: "Slats", _PLcanardPos: "Canard angle", _PLvtOn: "Vectored thrust", _PLvtAngle: "Rotor / thrust angle" };
const VAR_ZH = { _PLgearDown: "起落架", _PLgearPos: "起落架收放", _PLleftFlap: "左襟翼", _PLrightFlap: "右襟翼", _PLbrake: "減速板", _PLhook: "尾鉤", _PLafterBurner: "後燃器", _PLrudder: "方向舵", _PLswingWing: "可變翼後掠", _PLbayOpen: "彈艙", _PLbayDoorPos: "彈艙門角度", _PLslats: "前緣縫翼", _PLcanardPos: "前翼角度", _PLvtOn: "向量推力", _PLvtAngle: "旋翼／推力角度" };
const impName = (m, v) => Object.entries(m.imp || {}).find(([, a]) => a === +v)?.[0];
const varName = (m, v) => { const n = impName(m, v); return n ? (FAI18N.lang === "zh" ? VAR_ZH[n] : VAR_EN[n]) || n : ""; };
// friendly button labels for the common on/off variables
function valLabel(n, val){
  const on = val !== 0, sw = (a, b, c, d) => L(on ? a : b, on ? c : d);
  if (n === "_PLgearDown") return sw("Down", "Up", "放下", "收起");
  if (n === "_PLleftFlap" || n === "_PLrightFlap" || n === "_PLslats") return sw("Down", "Up", "放下", "收起");
  if (n === "_PLbrake" || n === "_PLbayOpen") return sw("Open", "Closed", "打開", "關閉");
  if (n === "_PLhook") return sw("Down", "Up", "放下", "收起");
  if (n === "_PLafterBurner" || n === "_PLvtOn") return sw("On", "Off", "開", "關");
  if (n === "_PLrudder") return val === 0 ? L("Centre", "置中") : val > 0 ? L("Right", "右") : L("Left", "左");
  return val === -1 ? "FF" : String(val);
}
function setupParts(it){
  const box = $("m_parts"); box.innerHTML = "";
  if (it.state !== "ok" || !it.m.subs?.length || !(it.m.ctl.blocks.length || it.m.ctl.statics?.length)) return;
  const m = it.m, st = it.pst; const reach = it.reachInfo ??= reachable(it); it.reach = new Set(reach.keys());
  const redraw = () => { upload(it); paint($("m_cv"), it, $("m_axes").checked); paint(it.cv, it);
    box.querySelectorAll("input[data-p]").forEach(cb => cb.parentElement.style.opacity = it.drawn.has(+cb.dataset.p) ? 1 : 0.5); };
  let html = "", named = m.ctl.vars.filter(x => impName(m, x.v)), other = m.ctl.vars.filter(x => !impName(m, x.v));
  const row = x => {
    const n = impName(m, x.v), label = varName(m, x.v) || `[${hex(x.v)}]${x.vals.includes(-1) ? " " + L("moving surface?", "活動面？") : ""}`;
    let h = "";
    const opts = n && n !== "_PLrudder" && n !== "_PLgearPos" && n !== "_PLbayDoorPos" ? [0, x.vals.find(v => v !== 0) ?? 1] : n === "_PLrudder" ? [-1, 0, 1] : optsOf(x);
    if (x.vals.length) h += `<div class="row"><b title="${n || hex(x.v)}">${label}</b>` + opts.map(val => `<button data-v="${x.v}" data-x="${val}" class="${(n && n !== "_PLrudder" ? (st.vars[x.v] !== 0) === (val !== 0) : st.vars[x.v] === val) ? "on" : ""}">${n ? valLabel(n, val) : val === -1 ? "FF" : val}</button>`).join("") + `</div>`;
    if (x.ang){ const r = n === "_PLgearPos" || n === "_PLbayDoorPos" ? [0, 32767] : [-32768, 32767];
      h += `<div class="row"><b title="${n || hex(x.v)}">${x.vals.length ? "" : label}${x.vals.length ? L("angle", "角度") : ""}</b><input type="range" min="${r[0]}" max="${r[1]}" step="128" value="${st.vars[x.v] ?? 0}" data-ang="${x.v}"><span class="angv">${st.vars[x.v] ?? 0}</span><button data-zero="${x.v}">${L("Zero", "歸零")}</button></div>`; }
    return h; };
  html += `<h3>${L("Moving parts", "活動零件")}</h3>` + named.map(row).join("");
  if (other.length) html += (named.length ? `<details><summary>${L("Other control variables (unnamed)", "其他控制變數（沒有名稱）")}</summary>` : "") + other.map(row).join("") + (named.length ? "</details>" : "");
  html += `<details><summary>${L(`Part list (${m.subs.length})`, `零件清單（${m.subs.length}）`)}</summary><div class="row"><span class="plist">` + m.subs.map((sub, k) => {
    const r = reach.get(k), how = r ? L(`shown when ${r.label}`, `出現條件：${r.label}`) : L("no code draws it", "沒有指令會畫它");
    return `<label title="@${sub.o.toString(16)} · ${sub.n} ${L("pts", "點")} · ${sub.f.length} ${L("faces", "面")} · ${how}"><input type="checkbox" data-p="${k}" ${st.off.has(k) ? "" : "checked"}>${k}</label>`; }).join("") + `</span></div>`;
  if (m.subs.some((_, k) => !reach.has(k))) html += `<div class="row"><label><input type="checkbox" id="p_free" ${st.free ? "checked" : ""}> ${L("Also draw parts no code controls (raw coordinates)", "也畫沒有指令控制的零件（原始座標）")}</label></div>`;
  html += `<div class="row"><button id="p_reset">${L("Reset parts", "零件重設")}</button></div></details>`;
  box.innerHTML = html;
  box.querySelectorAll("button[data-v]").forEach(b => b.onclick = () => { st.vars[b.dataset.v] = +b.dataset.x;
    // the gear switch also moves the gear angle, as FA does when the gear goes up or down
    if (impName(m, b.dataset.v) === "_PLgearDown" && m.imp._PLgearPos != null && m.ctl.vars.some(x => x.v === m.imp._PLgearPos)) st.vars[m.imp._PLgearPos] = +b.dataset.x ? 0 : 32767;
    setupParts(it); });
  box.querySelectorAll("input[data-ang]").forEach(r => r.oninput = () => { st.vars[r.dataset.ang] = +r.value; r.nextElementSibling.textContent = r.value; redraw(); });
  box.querySelectorAll("button[data-zero]").forEach(b => b.onclick = () => { st.vars[b.dataset.zero] = 0; setupParts(it); });
  box.querySelectorAll("input[data-p]").forEach(cb => cb.onchange = () => { const k = +cb.dataset.p; cb.checked ? st.off.delete(k) : st.off.add(k); redraw(); });
  const fr = $("p_free"); if (fr) fr.onchange = () => { st.free = fr.checked; redraw(); };
  $("p_reset").onclick = () => { it.pst = defaultState(m); setupParts(it); };
  box.querySelectorAll("details").forEach((d, i) => { d.open = !!it.openDet?.[i]; d.ontoggle = () => { (it.openDet ??= [])[i] = d.open; }; });
  redraw();
}

// ===== Enlarged view =====
let mItem = null; const mcv = $("m_cv");
attachControls(mcv, () => mItem, () => paint(mcv, mItem, $("m_axes").checked));
function openModal(it){ mItem = it; $("modal").classList.add("show"); $("m_name").textContent = it.k + ".SH";
  want(it);
  const info = () => { $("m_info").textContent = it.state === "ok" ? L(`${it.m.v.length} vertices · ${it.nFaces} faces (${it.nTex} textured)${it.m.subs.length ? ` · ${it.m.subs.length} parts` : ""} · L ${it.size[1]} · W ${it.size[0]} · H ${it.size[2]} ft${it.pic ? " · " + it.pic : ""}`, `${it.m.v.length} 頂點・${it.nFaces} 面（${it.nTex} 有貼圖）${it.m.subs.length ? `・${it.m.subs.length} 個零件` : ""}・長 ${it.size[1]}・寬 ${it.size[0]}・高 ${it.size[2]} 呎${it.pic ? "・" + it.pic : ""}`) : ""; };
  info();
  const rel = related(it.k);
  $("m_rel").innerHTML = rel.length > 1 ? `<span style="color:var(--muted)">${L("Same object:", "同一物件：")}</span>` + rel.map(n => { const s = n.match(/_([A-DS])$/)?.[1];
    const t = !s || n === baseOf(n) ? L("intact", "完整") : s === "S" ? L("shadow", "陰影") : L("wreck ", "殘骸 ") + s;
    return `<button data-k="${n}" class="${n === it.k ? "on" : ""}">${n} · ${t}</button>`; }).join("") : "";
  $("m_rel").querySelectorAll("button").forEach(b => b.onclick = () => openModal(byKey.get(b.dataset.k)));
  renderFlags(); setupParts(it); requestAnimationFrame(() => paint(mcv, it, $("m_axes").checked));
  if (it.state !== "ok") { const iv = setInterval(() => { if (mItem !== it){ clearInterval(iv); return; } if (it.state === "ok" || it.state === "bad" || it.state === "missing"){ clearInterval(iv); info(); setupParts(it); paint(mcv, it, $("m_axes").checked); } }, 150); }
}
$("m_close").onclick = () => { $("modal").classList.remove("show"); const it = mItem; mItem = null; if (it && it.state === "ok") paint(it.cv, it); };
$("modal").onclick = e => { if (e.target === $("modal")) $("m_close").onclick(); };
$("m_axes").onchange = () => mItem && paint(mcv, mItem, $("m_axes").checked);
window.addEventListener("keydown", e => { if (e.key === "Escape" && mItem) $("m_close").onclick(); });
let rsT = 0; window.addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(() => { for (const it of visible) if (it.el.style.display !== "none") paint(it.cv, it); if (mItem) paint(mcv, mItem, $("m_axes").checked); }, 150); });
renderFlags(); stat();
// FA's palette (PIC/PALETTE.PAL); until it arrives the shapes are grey
(async () => { let u8 = null; try { const r = await fetch(/^https?:$/.test(location.protocol) ? "../PIC/PALETTE.PAL" : REMOTE + "PIC/PALETTE.PAL"); if (r.ok) u8 = new Uint8Array(await r.arrayBuffer()); } catch(e){}
  if (!u8) try { const r = await fetch(REMOTE + "PIC/PALETTE.PAL"); if (r.ok) u8 = new Uint8Array(await r.arrayBuffer()); } catch(e){}
  if (u8){ setPal(palFromBytes(u8)); for (const it of visible) if (it.state === "ok") paint(it.cv, it); if (mItem) paint(mcv, mItem, $("m_axes").checked); } })();
window.shGallery = { items, byKey, openModal, setMode };
</script>
