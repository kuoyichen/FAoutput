<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FA SH 外型檢視</title>
<style>
:root{ --bg:#14181d; --card:#1d232b; --line:#2e3742; --text:#dde3ea; --muted:#8b96a5; --accent:#ffd54a; --bad:#ff6a50; --ok:#5fd38d; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 8px 0 0;font-weight:600}
button,select,input[type=search],label.btn{background:#262e38;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
input[type=search]{cursor:text;width:150px}
button:hover,label.btn:hover{border-color:var(--muted)}
#stat{color:var(--muted)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:12px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.card.flag{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.card canvas{width:100%;aspect-ratio:1/1;display:block;cursor:grab;touch-action:none;background:radial-gradient(#2a323c,#181d23)}
.card canvas:active{cursor:grabbing}
.card .meta{display:flex;align-items:center;gap:6px;padding:5px 8px}
.card .nm{font-weight:600;font-family:ui-monospace,Consolas,monospace}
.card .info{color:var(--muted);font-size:11px;margin-left:auto;text-align:right}
.card .acts{display:flex;gap:6px;padding:0 8px 7px}
.card .acts button{padding:2px 8px;font-size:12px}
.card .acts button.on{border-color:var(--bad);color:var(--bad)}
.card.fail canvas{opacity:.35}
#modal{position:fixed;inset:0;z-index:20;background:rgba(5,8,12,.85);display:none;align-items:center;justify-content:center}
#modal.show{display:flex}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:min(92vw,820px)}
#modal canvas{width:100%;aspect-ratio:4/3;display:block;cursor:grab;touch-action:none;background:radial-gradient(#2a323c,#181d23);border-radius:6px}
#modal .bar{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
#modal .bar b{font-family:ui-monospace,Consolas,monospace;font-size:16px}
#m_parts{margin-top:8px;font-size:12px;max-height:30vh;overflow:auto}
#m_parts .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0}
#m_parts .row b{min-width:110px;font-weight:600}
#m_parts button{padding:2px 9px;font-size:12px}
#m_parts button.on{border-color:var(--accent);color:var(--accent)}
#m_parts input[type=range]{flex:1;min-width:140px}
#m_parts .plist{display:flex;flex-direction:column;gap:2px;color:var(--muted)}
#m_parts .plist label{display:flex;gap:6px;align-items:center;cursor:pointer}
#m_parts .sw{display:inline-block;width:10px;height:10px;border-radius:2px}
#flagbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:8px 16px;display:flex;gap:10px;align-items:center}
#flaglist{flex:1;font-family:ui-monospace,Consolas,monospace;color:var(--bad);overflow:auto;white-space:nowrap}
#hint{color:var(--muted);font-size:12px}
@media (max-width:600px){ #grid{grid-template-columns:repeat(2,1fr);gap:8px;padding:8px} header{padding:8px} }
</style>
</head>
<body>
<header>
  <h1>FA SH 外型檢視</h1>
  <input type="search" id="q" placeholder="搜尋檔名…">
  <select id="show">
    <option value="ok">只看解得出的</option>
    <option value="all">全部</option>
    <option value="fail">只看解不出的</option>
    <option value="flag">只看標記有問題的</option>
  </select>
  <select id="mode" title="上色方式">
    <option value="solid">單色＋光影</option>
    <option value="face">每個面不同色（看面怎麼拼）</option>
    <option value="wire">線框＋頂點</option>
  </select>
  <label class="btn">選擇 SH 資料夾<input id="dir" type="file" webkitdirectory multiple hidden></label>
  <span id="stat">載入中…</span>
  <span id="hint">拖曳旋轉・滾輪縮放・雙擊放大</span>
</header>
<div id="grid"></div>
<div id="flagbar"><span>有問題：</span><span id="flaglist">（按卡片上的「有問題」標記，清單會出現在這裡）</span><button id="copy">複製清單</button><button id="clear">清除</button></div>
<div id="modal"><div class="box">
  <div class="bar"><b id="m_name"></b><span id="m_info" style="color:var(--muted)"></span><span style="flex:1"></span>
    <label><input type="checkbox" id="m_axes" checked> 座標軸</label><button id="m_flag">有問題</button><button id="m_close">關閉</button></div>
  <canvas id="m_cv"></canvas>
  <div id="m_parts"></div>
</div></div>
<script>
"use strict";
// ===== SH 解析（和 fa_replay.html 同一份） =====
// 長表頭（旗標沒有 0x200）的面：旗標低位元組只會是這些值（在整個 SH 庫裡統計過）
const FACE_OPS = new Set([0x41,0x44,0x49,0x4C,0x51,0x54,0x59,0x5C,0x61,0x63,0x64,0x69,0x6B,0x6C,0x71,0x73,0x7C,0xCD,0xDD,0xED,0xEE,0xFE]);
function parseSH(u8){
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let base = 0x400;
  if (u8[0] === 0x4D && u8[1] === 0x5A){
    const pe = dv.getUint32(0x3C, true), ns = dv.getUint16(pe+6, true), opt = dv.getUint16(pe+20, true);
    for (let i=0;i<ns;i++){ const s = pe+24+opt+i*40; if (String.fromCharCode(...u8.subarray(s, s+4)) === "CODE"){ base = dv.getUint32(s+20, true); break; } }
  }
  const c = u8.subarray(base), cv = new DataView(c.buffer, c.byteOffset, c.byteLength), L = c.length;
  const shift = L > 8 ? cv.getUint16(6, true) : 8, scale = shift >= 4 && shift <= 16 ? Math.pow(2, shift - 8) : 1;
  // 找第一個 LOD 的所有頂點緩衝（目標位置要剛好接續前面的點數）
  const bufs = [], maxAbs = (o, n) => { let m = 0; for (let i = 0; i < 3*n; i++) m = Math.max(m, Math.abs(cv.getInt16(o + 6 + 2*i, true))); return m; };
  for (let o=0;o<L-6;o++){
    if (c[o] !== 0x82 || c[o+1] !== 0) continue;
    const n = cv.getUint16(o+2,true), t = cv.getUint16(o+4,true), e = o+6+6*n;
    if (!n || n > 4000 || t % 8 || e >= L) continue;
    if (!bufs.length){ if (t === 0 && n >= 3) bufs.push({ o, n, t:0, e }); continue; }
    const last = bufs[bufs.length-1];
    if (bufs.length === 1 && t === 0 && o < last.e && n >= 3 && maxAbs(o, n) * 4 < maxAbs(last.o, last.n)){ bufs[0] = { o, n, t:0, e }; continue; }   // 第一個是表頭裡的假 82（例如 C5），真的頂點緩衝落在它的範圍裡
    if (t === 0 && o >= last.e && (c[o-1] === 0 || c[o-1] === 0x1E)){ bufs.push({ o, n, t:-1 }); break; }   // 下一個 LOD
    const gap = t/8 - (last.t + last.n);   // 目標通常剛好接續；有些檔（F35A、Y141、SU27…）中間會跳過幾個位置
    if (o >= last.e && (gap === 0 || gap > 0 && gap <= 64 && (c[o-1] === 0 || c[o-1] === 0x1E) && maxAbs(o, n) < 8192)){ bufs.push({ o, n, t: t/8, e }); }
  }
  if (!bufs.length) return null;
  const lod = bufs.filter(b => b.t >= 0), stop = bufs.find(b => b.t < 0)?.o ?? L;
  const v = [];
  for (const b of lod) for (let i=0;i<b.n;i++) v[b.t+i] = [cv.getInt16(b.o+6+6*i,true), cv.getInt16(b.o+8+6*i,true), cv.getInt16(b.o+10+6*i,true)];
  const facetsIn = (from, to, lo, hi) => {
    const f = [];
    for (let o=from; o<to-18; o++){
      if (c[o] !== 0xFC) continue;
      const fl = cv.getUint16(o+1,true), hl = fl & 0x200 ? 14 : 17;
      if (fl & 0x200 ? fl & 0xF000 || !FACE_OPS.has(fl & 0xFF) && (fl & 0xFF) !== 0xFD && (fl & 0xFF) !== 0x74 : !FACE_OPS.has(fl & 0xFF) || fl >= 0x1000) continue;   // 短表頭也只認統計過的旗標（再加上 F-14 用的 FD、74）；SPE 尾翼前的假三角形是 7F   // 長表頭的面只認統計過的旗標，避免把資料誤當成面
      const n = c[o+hl], wide = fl & 0x400; let p = o+hl+1;
      if (n < 3 || n > 16 || p + n*(wide?2:1) > to) continue;
      const idx = []; for (let k=0;k<n;k++){ idx.push(wide ? cv.getUint16(p,true) : c[p]); p += wide?2:1; }
      if (idx.some(i => i < lo || i >= hi || !v[i]) || new Set(idx).size < n) continue;
      f.push(idx); o = p - 1;   // 跳過這個面的資料，免得在它的索引裡又讀出假的面（F5EV 右側的三角形）
    }
    return f;
  };
  const main = lod[0], mainEnd = lod[1]?.o ?? stop;
  const f = facetsIn(main.e, mainEnd, 0, main.n);
  if (!f.length) return null;
  let span = 0; for (let i=0;i<main.n;i++) span = Math.max(span, Math.abs(v[i][0]));
  const parts = [];
  for (let k=1;k<lod.length;k++){
    const b = lod[k], to = lod[k+1]?.o ?? stop; if (b.n < 12) continue;
    let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
    for (let i=0;i<b.n;i++){ const p = v[b.t+i]; x0 = Math.min(x0,p[0]); x1 = Math.max(x1,p[0]); z0 = Math.min(z0,p[2]); z1 = Math.max(z1,p[2]); }
    const ax = Math.max(Math.abs(x0), Math.abs(x1));
    if (ax < span*0.6 || z1 - z0 > (x1 - x0)*0.5) continue;
    const pf = facetsIn(b.e, to, b.t, b.t + b.n); if (!pf.length) continue;
    const pts = []; for (let i=0;i<b.n;i++) pts.push(v[b.t+i]);
    // 轉軸：外翼套（主體）最外側的前角（機翼弦長範圍內、離機身最遠、最前面的主體頂點）
    const side = Math.sign(x0 + x1), tipX = side > 0 ? x1 : -x0;
    const ys = pts.map(p => p[1]), wy0 = Math.min(...ys), wy1 = Math.max(...ys), lenY = 2*span;
    let g = null; for (let i=0;i<main.n;i++){ const p = v[i], ax2 = p[0]*side;
      if (ax2 > 0 && ax2 < tipX*0.6 && p[1] >= wy0 && p[1] <= wy1 + 0.15*lenY && (!g || ax2 > g[0]*side || (ax2 === g[0]*side && p[1] > g[1]))) g = p; }
    const piv = g ? [g[0], g[1]] : [0, 0];
    parts.push({ f: pf, wing: true, side, pivot: [piv[0], piv[1], 0] });
  }
  // 第一個 LOD 的所有附屬頂點組（起落架、襟翼、空氣煞車…），以及控制它們的指令
  const subs = lod.slice(1).map((b, k) => ({ o: b.o, t: b.t, n: b.n, f: facetsIn(b.e, lod[k+2]?.o ?? stop, b.t, b.t + b.n),
    local: b.o >= 14 && c[b.o-14] === 0xFF && c[b.o-13] === 0xFF }));
  return { v: v.map(p => p || [0,0,0]), f, parts, scale, subs, code: c, ctl: parseCtl(c, cv, subs) };
}
// SH 裡的 F0 區塊是 x86 機器碼，遊戲直接執行；常見的寫法：
//   cmp word [變數], 值 ; jne …           → 條件（起落架放下、襟翼放下…）
//   call $+5 ; pop ebx ; add ebx, n ; mov ax, [角度變數] ; sar/shl/add/sub/neg ; mov [ebx+d], ax
//                                          → 執行時改寫後面 C4 指令的欄位（起落架收放、可變翼後掠角度）
//   push 返回位址 ; push 直譯器 ; ret      → 回到位元碼，從返回位址繼續
// 返回位址的指令：C4 00 x 上 前 方位 俯仰 滾轉 rel16 = 把頂點組放在 (x,上,前) 並旋轉後畫出；12 00 rel16 = 直接畫頂點組
// 這裡用一個很小的 x86 模擬器照實際狀態執行，算出要畫哪些零件、放在哪裡。
const SH_VA = 0x1000;
function x86Run(mem, start, maxSteps = 400){
  const dv = new DataView(mem.buffer, mem.byteOffset, mem.byteLength), L = mem.length;
  const rd16 = va => { const o = va - SH_VA; return o >= 0 && o + 1 < L ? dv.getInt16(o, true) : 0; };
  const rd32 = va => { const o = va - SH_VA; return o >= 0 && o + 3 < L ? dv.getInt32(o, true) : 0; };
  const wr16 = (va, x) => { const o = va - SH_VA; if (o >= 0 && o + 1 < L) dv.setInt16(o, x, true); };
  const s16 = x => (x << 16) >> 16;
  let p = start, ax = 0, cx = 0, eax = 0, ebx = 0, fa = 0, fb = 0, sz = 16; const stack = [];
  const cc = op => { const sa = sz === 8 ? (fa << 24) >> 24 : sz === 16 ? s16(fa) : fa | 0, sb = sz === 8 ? (fb << 24) >> 24 : sz === 16 ? s16(fb) : fb | 0;
    const m = sz === 32 ? 0xFFFFFFFF : (1 << sz) - 1, ua = (fa & m) >>> 0, ub = (fb & m) >>> 0;
    switch (op & 0xF){ case 2: return ua < ub; case 3: return ua >= ub; case 4: return sa === sb; case 5: return sa !== sb;
      case 6: return ua <= ub; case 7: return ua > ub; case 0xC: return sa < sb; case 0xD: return sa >= sb; case 0xE: return sa <= sb; case 0xF: return sa > sb; } return null; };
  for (let n = 0; n < maxSteps; n++){
    const o = p - SH_VA; if (o < 0 || o >= L - 1) return null;
    const b0 = mem[o], b1 = mem[o+1], b2 = mem[o+2];
    if (b0 === 0x66){
      if (b1 === 0x83 && b2 === 0x3D){ fa = rd16(rd32(p+3)); fb = (mem[o+7] << 24) >> 24; sz = 16; p += 8; continue; }
      if (b1 === 0x81 && b2 === 0x3D){ fa = rd16(rd32(p+3)); fb = dv.getInt16(o+7, true); sz = 16; p += 9; continue; }
      if (b1 === 0xA1){ ax = rd16(rd32(p+2)); p += 6; continue; }
      if (b1 === 0x8B && b2 === 0xC8){ cx = ax; p += 3; continue; }
      if (b1 === 0x89 && b2 === 0xC1){ cx = ax; p += 3; continue; }
      if (b1 === 0x8B && b2 === 0xC1){ ax = cx; p += 3; continue; }
      if (b1 === 0x89 && b2 === 0xC8){ ax = cx; p += 3; continue; }
      if (b1 === 0xD1 && b2 === 0xF8){ ax = s16(ax) >> 1; p += 3; continue; }
      if (b1 === 0xD1 && b2 === 0xF9){ cx = s16(cx) >> 1; p += 3; continue; }
      if (b1 === 0xC1 && b2 === 0xF8){ ax = s16(ax) >> mem[o+3]; p += 4; continue; }
      if (b1 === 0xC1 && b2 === 0xF9){ cx = s16(cx) >> mem[o+3]; p += 4; continue; }
      if (b1 === 0xD1 && b2 === 0xE0){ ax = s16(ax << 1); p += 3; continue; }
      if (b1 === 0xC1 && b2 === 0xE0){ ax = s16(ax << mem[o+3]); p += 4; continue; }
      if ((b1 === 0x03 && b2 === 0xC1) || (b1 === 0x01 && b2 === 0xC8)){ ax = s16(ax + cx); p += 3; continue; }
      if ((b1 === 0x2B && b2 === 0xC1) || (b1 === 0x29 && b2 === 0xC8)){ ax = s16(ax - cx); p += 3; continue; }
      if (b1 === 0x05){ ax = s16(ax + dv.getInt16(o+2, true)); p += 4; continue; }
      if (b1 === 0x2D){ ax = s16(ax - dv.getInt16(o+2, true)); p += 4; continue; }
      if (b1 === 0x83 && b2 === 0xC0){ ax = s16(ax + ((mem[o+3] << 24) >> 24)); p += 4; continue; }
      if (b1 === 0x83 && b2 === 0xE8){ ax = s16(ax - ((mem[o+3] << 24) >> 24)); p += 4; continue; }
      if (b1 === 0x3D){ fa = ax; fb = dv.getInt16(o+2, true); sz = 16; p += 4; continue; }
      if (b1 === 0x83 && b2 === 0xF8){ fa = ax; fb = (mem[o+3] << 24) >> 24; sz = 16; p += 4; continue; }
      if (b1 === 0xB8){ ax = dv.getInt16(o+2, true); p += 4; continue; }
      if (b1 === 0xF7 && b2 === 0xD8){ ax = s16(-ax); p += 3; continue; }
      if (b1 === 0x89 && b2 === 0x43){ wr16(ebx + ((mem[o+3] << 24) >> 24), ax); p += 4; continue; }
      if (b1 === 0x89 && b2 === 0x83){ wr16(ebx + dv.getInt32(o+3, true), ax); p += 7; continue; }
      if (b1 === 0xA3){ wr16(rd32(p+2), ax); p += 6; continue; }
      return null;
    }
    if (b0 === 0x80 && b1 === 0x3D){ const a = rd32(p+2) - SH_VA; fa = a >= 0 && a < L ? mem[a] : 0; fb = mem[o+6]; sz = 8; p += 7; continue; }
    if (b0 === 0x83 && b1 === 0x3D){ fa = rd32(rd32(p+2)); fb = (mem[o+6] << 24) >> 24; sz = 32; p += 7; continue; }
    if (b0 === 0xA1){ eax = rd32(rd32(p+1)); ax = s16(eax); p += 5; continue; }
    if (b0 >= 0x70 && b0 <= 0x7F){ const t = cc(b0); if (t == null) return null; p += 2 + (t ? (b1 << 24) >> 24 : 0); continue; }
    if (b0 === 0x0F && b1 >= 0x80 && b1 <= 0x8F){ const t = cc(b1); if (t == null) return null; p += 6 + (t ? dv.getInt32(o+2, true) : 0); continue; }
    if (b0 === 0xEB){ p += 2 + ((b1 << 24) >> 24); continue; }
    if (b0 === 0xE9){ p += 5 + dv.getInt32(o+1, true); continue; }
    if (b0 === 0xE8){ stack.push(p + 5); p += 5 + dv.getInt32(o+1, true); continue; }
    if (b0 === 0x5B){ ebx = stack.pop() ?? 0; p += 1; continue; }
    if (b0 === 0x53){ stack.push(ebx); p += 1; continue; }
    if (b0 === 0x81 && b1 === 0xC3){ ebx += dv.getInt32(o+2, true); p += 6; continue; }
    if (b0 === 0x83 && b1 === 0xC3){ ebx += (b2 << 24) >> 24; p += 3; continue; }
    if (b0 === 0x68){ stack.push(dv.getInt32(o+1, true)); p += 5; continue; }
    if (b0 === 0xC3){ stack.pop(); return stack.length ? stack.pop() : null; }   // push 返回位址 ; push 直譯器 ; ret → 返回位址
    return null;
  }
  return null;
}
// 靜態掃描：找出每個 F0 區塊、比較過的變數和值、讀過的角度變數
function parseCtl(c, cv, subs){
  // 跳躍目標可能是頂點組前面的子外型表頭或其他短指令：取目標之後 16 位元組內的第一個頂點組
  const idxOf = { get: t => { let best = null; subs.forEach((s, i) => { if (s.o >= t && s.o - t <= 16 && (best == null || s.o < subs[best].o)) best = i; }); return best ?? undefined; } };
  const blocks = [], vars = new Map();
  for (let o = 0; o < c.length - 12; o++){
    if (c[o] !== 0xF0 || c[o+1] !== 0) continue;
    if (x86Run(c, o + 2 + SH_VA) == null) continue;   // 不是能執行到 ret 的程式碼
    blocks.push(o + 2);
    // 掃這一段直到 ret，收集變數
    for (let p = o + 2, n = 0; p < c.length - 8 && n < 60; n++){
      if (c[p] === 0x66 && c[p+1] === 0x83 && c[p+2] === 0x3D){ const v = cv.getUint32(p+3, true); const s = vars.get(v) || { vals: new Set(), ang: false }; s.vals.add((c[p+7] << 24) >> 24); vars.set(v, s); p += 8; continue; }
      if (c[p] === 0x66 && c[p+1] === 0xA1){ const v = cv.getUint32(p+2, true); const s = vars.get(v) || { vals: new Set(), ang: false }; s.ang = true; vars.set(v, s); p += 6; continue; }
      if (c[p] === 0x68 && c[p+5] === 0x68 && c[p+10] === 0xC3) break; p++;
    }
  }
  // 主體位元碼裡沒有條件的 C4（例如 B-2 的兩個零件）：目標必須剛好是某個頂點組
  const statics = [], exact = new Map(); subs.forEach((s, i) => { exact.set(s.o, i); exact.set(s.o - 14, i); });
  const end = subs.length ? Math.min(...subs.map(s => s.o)) : 0;
  const pushed = new Set(); for (let o = 0; o < c.length - 5; o++) if (c[o] === 0x68) pushed.add(cv.getUint32(o + 1, true) - SH_VA);   // 有 F0 區塊會跳到的指令不算

}
const PART_COL = { c4: [235,150,60], j12: [90,200,120], free: [150,150,150] };
// 依目前狀態組出要畫的面：主體 + 照 SH 指令算出來要畫的零件
// 零件的座標轉換：輸入 SH 頂點 (x, 前, 上)，輸出顯示座標 (x, 上, 前)；有上層零件（例如主翼）時再套上層的轉換
function partTf(e){
  let tf = v => [v[0], v[2], v[1]];
  if (e.op === 0xC4){
    const deg = e.f6.slice(3).map(a => a * 360 / 65536), pos = e.f6.slice(0, 3);   // pos = (x, 上, 前)；角度 = 方位、俯仰、滾轉
    tf = v => { const r = rotateDeg([v[0], v[2], v[1]], deg[0], deg[1], deg[2]); return [pos[0] + r[0], pos[1] + r[1], pos[2] + r[2]]; };
  }
  if (!e.parent) return tf;
  const up = partTf(e.parent);
  return v => { const d = tf(v); return up([d[0], d[2], d[1]]); };
}
function buildFaces(it){
  const m = it.m, st = it.pst, faces = [];
  for (const idx of m.f) faces.push(idx.map(i => [m.v[i][0], m.v[i][2], m.v[i][1]]));
  const drawn = new Set(); it.drawn = drawn;
  for (const e of evalCtl(m, st.vars)){
    if (st.off.has(e.part) || drawn.has(e.part)) continue; drawn.add(e.part);
    const sub = m.subs[e.part], tf = partTf(e), col = e.op === 0xC4 || e.parent ? PART_COL.c4 : PART_COL.j12;
    for (const idx of sub.f){ const f = idx.map(i => tf(m.v[i])); f.col = col; faces.push(f); }
  }
  if (st.free) m.subs.forEach((sub, k) => { if (drawn.has(k) || st.off.has(k) || it.reach?.has(k)) return;
    for (const idx of sub.f){ const f = idx.map(i => [m.v[i][0], m.v[i][2], m.v[i][1]]); f.col = PART_COL.free; faces.push(f); } });
  return faces;
}
const hex = v => (v >>> 0).toString(16).toUpperCase();
// 預設狀態：條件變數用第一個比較值（通常是起落架放下、襟翼收起），角度變數 0
function defaultState(m){ const vars = {}; for (const x of m.ctl.vars) vars[x.v] = x.vals.length ? x.vals[0] : 0; return { vars, off: new Set(), free: false }; }
const optsOf = x => [...new Set([0, ...x.vals, ...(x.vals.length ? [1, -1] : [])])].sort((a, b) => a - b);
// 哪些零件在某個狀態下會被畫到（列出條件用）
function reachable(it){
  const m = it.m, reach = new Map(), base = defaultState(m).vars, cvars = m.ctl.vars.filter(x => x.vals.length);
  const tryState = (st, label) => { for (const e of evalCtl(m, st)) if (!reach.has(e.part)) reach.set(e.part, { label, op: e.op }); };
  tryState(base, "預設");
  for (const x of cvars) for (const val of optsOf(x)) tryState({ ...base, [x.v]: val }, `[${hex(x.v)}]=${val === -1 ? "FF" : val}`);
  return reach;
}
function setupParts(it){
  const box = $("m_parts"); box.innerHTML = "";
  if (it.state !== "ok" || !it.m.subs?.length || !it.m.ctl.blocks.length){ return; }
  const m = it.m; it.pst ??= defaultState(m); const st = it.pst;
  const reach = it.reachInfo ??= reachable(it); it.reach = new Set(reach.keys());
  const redraw = () => { it.faces = buildFaces(it); render($("m_cv"), it, $("m_axes").checked);
    box.querySelectorAll("input[data-p]").forEach(cb => cb.parentElement.style.opacity = it.drawn.has(+cb.dataset.p) ? 1 : 0.5); };
  let html = "";
  for (const x of m.ctl.vars){
    if (x.vals.length){
      const guess = x.vals.includes(-1) ? "活動面？" : "";
      html += `<div class="row"><b>[${hex(x.v)}] ${guess}</b>` + optsOf(x).map(val => `<button data-v="${x.v}" data-x="${val}" class="${st.vars[x.v] === val ? "on" : ""}">${val === -1 ? "FF" : val}</button>`).join("") + `</div>`;
    }
    if (x.ang) html += `<div class="row"><b>[${hex(x.v)}] 角度</b><input type="range" min="-32768" max="32767" step="128" value="${st.vars[x.v] ?? 0}" data-ang="${x.v}"><span class="angv">${st.vars[x.v] ?? 0}</span><button data-zero="${x.v}">歸零</button></div>`;
  }
  html += `<div class="row"><b>零件</b><span class="plist">` + m.subs.map((sub, k) => {
    const r = reach.get(k), col = r ? (r.op === 0xC4 ? PART_COL.c4 : PART_COL.j12) : PART_COL.free;
    const how = r ? `${r.op === 0xC4 ? "C4 放置" : "原地畫"}，出現條件：${r.label}` : "沒有指令會畫它";
    return `<label title="@${sub.o.toString(16)} ${sub.n} 點 ${sub.f.length} 面"><input type="checkbox" data-p="${k}" ${st.off.has(k) ? "" : "checked"}><span class="sw" style="background:rgb(${col})"></span>${k}：${how}</label>`; }).join("") + `</span></div>`;
  if (m.subs.some((_, k) => !reach.has(k))) html += `<div class="row"><label><input type="checkbox" id="p_free" ${st.free ? "checked" : ""}> 也畫沒有指令控制的零件（原始座標，灰色）</label></div>`;
  html += `<div class="row" style="color:var(--muted)">橘色 = C4 放置的零件，綠色 = 原地畫的零件；目前狀態下沒畫出的零件會變淡。</div>`;
  box.innerHTML = html;
  box.querySelectorAll("button[data-v]").forEach(b => b.onclick = () => { st.vars[b.dataset.v] = +b.dataset.x; setupParts(it); render(it.cv, it); });
  box.querySelectorAll("input[data-ang]").forEach(r => r.oninput = () => { st.vars[r.dataset.ang] = +r.value; r.nextElementSibling.textContent = r.value; redraw(); });
  box.querySelectorAll("button[data-zero]").forEach(b => b.onclick = () => { st.vars[b.dataset.zero] = 0; setupParts(it); });
  box.querySelectorAll("input[data-p]").forEach(cb => cb.onchange = () => { const k = +cb.dataset.p; cb.checked ? st.off.delete(k) : st.off.add(k); redraw(); });
  const fr = $("p_free"); if (fr) fr.onchange = () => { st.free = fr.checked; redraw(); };
  redraw();
}
// ===== 放大檢視 =====
let mItem = null; const mcv = $("m_cv");
attachControls(mcv, () => mItem, () => render(mcv, mItem, $("m_axes").checked));
function openModal(it){ mItem = it; $("modal").classList.add("show"); $("m_name").textContent = it.k + ".SH";
  $("m_info").textContent = it.state === "ok" ? `${it.m.v.length} 頂點・${it.m.f.length} 面${it.m.subs.length ? `・${it.m.subs.length} 個零件` : ""}・比例 ×${it.m.scale}・約 長 ${it.p.size[1]}・寬 ${it.p.size[0]}・高 ${it.p.size[2]} 呎` : "";
  renderFlags(); setupParts(it); requestAnimationFrame(() => render(mcv, it, $("m_axes").checked)); }
$("m_close").onclick = () => { $("modal").classList.remove("show"); if (mItem) render(mItem.cv, mItem); mItem = null; };
$("modal").onclick = e => { if (e.target === $("modal")) $("m_close").onclick(); };
$("m_axes").onchange = () => mItem && render(mcv, mItem, $("m_axes").checked);
$("m_flag").onclick = () => { if (!mItem) return; flags.has(mItem.k) ? flags.delete(mItem.k) : flags.add(mItem.k); saveFlags(); };
window.addEventListener("keydown", e => { if (e.key === "Escape" && mItem) $("m_close").onclick(); });
window.addEventListener("resize", () => { for (const it of items) if (it.state === "ok" && it.el.style.display !== "none") render(it.cv, it); });
renderFlags(); stat();
</script>
</body>
